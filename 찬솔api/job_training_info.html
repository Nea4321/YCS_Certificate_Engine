function searchWorkInfoBtn(){
	
	var searchParam = "";
	
	// 학력 파라메터 세팅

// 		}else{

// 		}

	//경력 세팅

// 	$("input:checkbox[name='career']:checked").each(function(){
// 		searchParam += "&career="+ $(this).val();
// 		careerChk  = $(this).val();
// 	});
	
	if($("select[name='career']").val() != ""){
		searchParam += "&career="+$("select[name='career']").val();
		careerChk  = $("select[name='career']").val();
	}	
	
	if($("select[name='education']").val() != ""){
		searchParam += "&education="+$("select[name='education']").val();
	}	
	
	//지역셋팅	
	if($("select[name='region']").val() != ""){
		searchParam += "&region="+$("select[name='region']").val();
	}	
	
	if(careerChk == "E"){
		
		if($("#minCareerM" ).val() == ""  ||  $("#maxCareerM" ).val() == "" ){

			}
		
		}
		searchParam += "&minCareerM="+$("#minCareerM" ).val()+"&maxCareerM="+$("#maxCareerM" ).val();
	}
	
	
	//if($("input:checkbox[name='deep']:checked").length == 1){ //상세조건일 경우만 세팅
	if($("#workNetInfo").hasClass("spread")){
		
		// 우대조건세팅
		$("input:checkbox[name='pref']:checked").each(function(index){
			if(index == 0){
				searchParam += "&pref="+ $(this).val();
			}else{
				searchParam += "|="+ $(this).val();
			}
		});
		
		//급여 세팅
		var salTp = "";
		
		$("input:checkbox[name='salTp']:checked").each(function(){
			searchParam += "&salTp="+ $(this).val();
			salTp  = $(this).val();
		});
		
		if(salTp != ""){
		
			if($("#minPay" ).val() == ""  ||  $("#maxPay" ).val() == "" ){
				alert("임금형태 선택시 금액을 입력해주세요");
				return;
			}else{
				if(isNaN($("#minPay" ).val()) || isNaN($("#maxPay" ).val())  ){
					alert("금액은 숫자만 가능합니다.");
					return ;
				}
			
			}
			searchParam += "&minPay="+$("#minPay" ).val()+"&maxPay="+$("#maxPay" ).val();
		}
		
		$("input:checkbox[name='holidayTp']:checked").each(function(index){
			if(index == 0){
				searchParam += "&holidayTp="+ $(this).val();
			}else{
				searchParam += "|="+ $(this).val();
			}
			
		});
		
		$("input:checkbox[name='workHrCd']:checked").each(function(index){
			if(index == 0){
				searchParam += "&workHrCd="+ $(this).val();
			}else{
				searchParam += "|="+ $(this).val();
			}
			
		});
		
		if($("#keyword" ).val() != ""   ){
			searchParam  += "&keyword="+$("#keyword" ).val();
		}
	
	}
// 	searchParam += education;
	searchWorkInfo(searchParam);
	
	
	updateCnt("1" , "2290" , "");
}

//20250211 웹접근성으로 인한 탭 사용
function jobTab(aTabId, idx) {
	idx = idx==null?0:idx;
	
	$("#"+ aTabId +" ul li:eq("+idx+")").addClass("on");
	$("#"+ aTabId +" ul li a").eq(idx).attr("title",$("#"+ aTabId +" ul li a").eq(idx).find("span").text().trim()+" 선택됌");//2015-06-11 KJH 접근성 위한 title 추가
	$("#"+ aTabId +" ul li a").click(function (e) {
		$("#"+ aTabId +" ul li a").each(function () {
			if ($(this).parent('li').hasClass("on")) {
				$(this).parent('li').removeClass("on");
			}
		});
		
		if($(this).parent('li').find("span").attr("class") == "worknet") {
			$("#searchWorkInfo_view").show();
			$("#includeTable").hide();
			$("#workNetInfo").show();
			$("#includeInfo").hide();
			$("#searchWorkInfo_view2").empty();
			$("#searchWorkInfo_view2").empty();
		} else if($(this).parent('li').find("span").attr("class") == "include") {

			$("#searchWorkInfo_view").hide();
			$("#includeTable").show();
			$("#includeInfo").show();
			$("#workNetInfo").hide();
			$("#searchWorkInfo_view").empty();
			$("#searchWorkInfo_view").empty();
		}
		
		$(this).parent('li').addClass("on");
		//2015-06-11 KJH 접근성 위한 title 추가
		$("#"+ aTabId +" ul li a").attr("title","");
		$(this).attr("title",$(this).text().trim()+" 선택됌");
	});
}
