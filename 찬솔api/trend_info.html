function fnChaart(){
	var statisYy = document.getElementById("statisYy").value;
	var implSeq = document.getElementById("implSeq").value;
	var trendDiv = document.getElementById("trendDiv").value;
	var trendDetail = document.getElementById("trendDetail").value;
	var maxYy = "2024";
	var jmCd = "2290";
	var jmNm = "";
	
	if(parseInt(statisYy) > parseInt(maxYy)) {
		alert("데이터 집계 이전입니다.");
		return;
	}
	
	var examInstiCd = "";
	/* 검색솔루선에서 1로보냄 일단 오류방지위해 리셋 */

		examInstiCd = "";
	}
	
	var url = "crf005.do?id=crf00504s01&gSite=Q&gId="
			+ "&statisYy=" + statisYy
			+ "&implSeq=" + implSeq
			+ "&trendDiv=" + trendDiv
			+ "&trendDetail=" + trendDetail
			+ "&examInstiCd=" + examInstiCd
	+ "&jmCd=" + jmCd
	+ "&jmNm=" + jmNm;
	
	var view  = "chartSearchRs";
	var view2 = "searchRs";
	
	callAjaxView(view, url, "", true, view2, false);
	chartInfo();
}

	var view = "chartSearchRs";
	
	callAjaxView(view, url, "", true);
}
